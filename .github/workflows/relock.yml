name: Relock

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The full hash of the commit to relock
        required: true
        type: string
      request:
        description: The release, as the dependents step sends it
        required: true
        type: string

permissions: {}

jobs:
  relock:
    name: Relock
    uses: noldova-com/.github/.github/workflows/relock-dependent.yml@17213c40842a4f4ae78cdb072582c686e72c57c9 # v2.41.5
    permissions:
      contents: read
      packages: read
    with:
      commit: ${{ inputs.commit }}
      request: ${{ inputs.request }}
