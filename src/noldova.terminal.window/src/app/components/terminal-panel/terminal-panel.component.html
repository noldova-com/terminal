@if (failure(); as text) {
  <div class="ended">
    <span class="ended-text">{{ text }}</span>
    <button nol-button type="button" [variant]="buttonVariant.Secondary" (click)="restartAtAsync(openingSize)">{{ resources.startAgain }}</button>
  </div>
}
@else if (sessionId(); as id) {
  <nol-terminal-pane [sessionId]="id" (restartRequested)="restartAtAsync($event)" />
}
